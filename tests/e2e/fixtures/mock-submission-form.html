<!DOCTYPE html>
<!--
  A stand-in for a real publishing site's submission page, used only by
  the Playwright tests in tests/e2e. Deliberately plain HTML/CSS/JS —
  the point is to exercise lib/playwright/actions.ts against a page we
  control, per section 35 ("use mock/test pages... instead of
  repeatedly interacting with production websites during automated
  tests"), not to look like any real channel.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mock submission form</title>
</head>
<body>
  <h1>Submit a story</h1>

  <div>
    <label for="title">Title</label>
    <input id="title" name="title" type="text" />
  </div>

  <div>
    <label for="subtitle">Subtitle</label>
    <input id="subtitle" name="subtitle" type="text" />
  </div>

  <div>
    <label for="body">Body</label>
    <textarea id="body" name="body" rows="10"></textarea>
  </div>

  <div>
    <label for="rich-body">Rich body</label>
    <div id="rich-body" contenteditable="true"></div>
  </div>

  <div>
    <label for="category">Category</label>
    <select id="category" name="category">
      <option value="">Choose one</option>
      <option value="tech">Technology</option>
      <option value="energy">Energy</option>
      <option value="business">Business</option>
    </select>
  </div>

  <div>
    <label for="tags">Tags</label>
    <input id="tags" name="tags" type="text" />
  </div>

  <div>
    <label for="image">Image</label>
    <input id="image" name="image" type="file" />
  </div>

  <button id="submit-button" type="button">Submit</button>

  <p id="status"></p>

  <script>
    document.getElementById('submit-button').addEventListener('click', function () {
      document.getElementById('status').textContent = 'Submitting…';
      setTimeout(function () {
        window.location.href = 'mock-success.html?published=1';
      }, 200);
    });
  </script>
</body>
</html>
